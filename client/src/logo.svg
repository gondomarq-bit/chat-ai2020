<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <!-- Blue glow filter -->
    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Linear gradient for Z -->
    <linearGradient id="zGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Circuit line gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Dark background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="400" height="200" rx="12" fill="url(#bgGrad)"/>

  <!-- Server rack silhouettes (left side) -->
  <g opacity="0.25">
    <rect x="8" y="30" width="22" height="140" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="32" y="45" width="22" height="125" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <!-- Server LEDs -->
    <circle cx="14" cy="40" r="1" fill="#3b82f6" opacity="0.6"/>
    <circle cx="14" cy="50" r="1" fill="#3b82f6" opacity="0.4"/>
    <circle cx="14" cy="60" r="1" fill="#22c55e" opacity="0.5"/>
    <circle cx="14" cy="70" r="1" fill="#3b82f6" opacity="0.3"/>
    <circle cx="38" cy="55" r="1" fill="#3b82f6" opacity="0.5"/>
    <circle cx="38" cy="65" r="1" fill="#22c55e" opacity="0.4"/>
    <circle cx="38" cy="75" r="1" fill="#3b82f6" opacity="0.3"/>
    <!-- Rack lines -->
    <line x1="8" y1="55" x2="30" y2="55" stroke="#334155" stroke-width="0.3"/>
    <line x1="8" y1="75" x2="30" y2="75" stroke="#334155" stroke-width="0.3"/>
    <line x1="8" y1="95" x2="30" y2="95" stroke="#334155" stroke-width="0.3"/>
    <line x1="8" y1="115" x2="30" y2="115" stroke="#334155" stroke-width="0.3"/>
    <line x1="8" y1="135" x2="30" y2="135" stroke="#334155" stroke-width="0.3"/>
    <line x1="32" y1="65" x2="54" y2="65" stroke="#334155" stroke-width="0.3"/>
    <line x1="32" y1="85" x2="54" y2="85" stroke="#334155" stroke-width="0.3"/>
    <line x1="32" y1="105" x2="54" y2="105" stroke="#334155" stroke-width="0.3"/>
    <line x1="32" y1="125" x2="54" y2="125" stroke="#334155" stroke-width="0.3"/>
    <line x1="32" y1="145" x2="54" y2="145" stroke="#334155" stroke-width="0.3"/>
  </g>

  <!-- Server rack silhouettes (right side) -->
  <g opacity="0.25">
    <rect x="370" y="35" width="22" height="135" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <rect x="346" y="50" width="22" height="120" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <circle cx="376" cy="45" r="1" fill="#3b82f6" opacity="0.5"/>
    <circle cx="376" cy="55" r="1" fill="#22c55e" opacity="0.4"/>
    <circle cx="376" cy="65" r="1" fill="#3b82f6" opacity="0.3"/>
    <circle cx="352" cy="60" r="1" fill="#3b82f6" opacity="0.4"/>
    <circle cx="352" cy="70" r="1" fill="#22c55e" opacity="0.3"/>
    <line x1="346" y1="70" x2="368" y2="70" stroke="#334155" stroke-width="0.3"/>
    <line x1="346" y1="90" x2="368" y2="90" stroke="#334155" stroke-width="0.3"/>
    <line x1="346" y1="110" x2="368" y2="110" stroke="#334155" stroke-width="0.3"/>
    <line x1="346" y1="130" x2="368" y2="130" stroke="#334155" stroke-width="0.3"/>
    <line x1="370" y1="60" x2="392" y2="60" stroke="#334155" stroke-width="0.3"/>
    <line x1="370" y1="80" x2="392" y2="80" stroke="#334155" stroke-width="0.3"/>
    <line x1="370" y1="100" x2="392" y2="100" stroke="#334155" stroke-width="0.3"/>
    <line x1="370" y1="120" x2="392" y2="120" stroke="#334155" stroke-width="0.3"/>
    <line x1="370" y1="140" x2="392" y2="140" stroke="#334155" stroke-width="0.3"/>
  </g>

  <!-- Circuit lines extending outward from Z -->
  <g stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.5" filter="url(#softGlow)">
    <!-- Left horizontal lines -->
    <path d="M 120 75 L 70 75 L 70 85 L 55 85" stroke-dasharray="0"/>
    <path d="M 120 95 L 80 95 L 80 105 L 60 105 L 60 115" />
    <path d="M 120 110 L 75 110 L 75 125 L 50 125" />
    <!-- Right horizontal lines -->
    <path d="M 200 75 L 250 75 L 250 85 L 270 85" />
    <path d="M 200 95 L 245 95 L 245 105 L 265 105 L 265 115" />
    <path d="M 200 110 L 255 110 L 255 125 L 280 125" />
    <!-- Downward lines -->
    <path d="M 160 120 L 160 145 L 130 145 L 130 160" />
    <path d="M 160 120 L 160 145 L 190 145 L 190 160" />
    <!-- Circuit nodes -->
    <circle cx="70" cy="75" r="1.5" fill="#60a5fa"/>
    <circle cx="80" cy="95" r="1.5" fill="#60a5fa"/>
    <circle cx="75" cy="110" r="1.5" fill="#60a5fa"/>
    <circle cx="250" cy="75" r="1.5" fill="#60a5fa"/>
    <circle cx="245" cy="95" r="1.5" fill="#60a5fa"/>
    <circle cx="255" cy="110" r="1.5" fill="#60a5fa"/>
    <circle cx="130" cy="145" r="1.5" fill="#60a5fa"/>
    <circle cx="190" cy="145" r="1.5" fill="#60a5fa"/>
    <rect x="68" y="83" width="4" height="4" fill="none" stroke="#3b82f6" stroke-width="0.5"/>
    <rect x="248" y="83" width="4" height="4" fill="none" stroke="#3b82f6" stroke-width="0.5"/>
  </g>

  <!-- Speech bubbles (translucent, blue glowing outline) -->
  <g filter="url(#softGlow)">
    <!-- Top-left bubble -->
    <g opacity="0.5">
      <path d="M 85 35 Q 85 25 95 25 L 120 25 Q 130 25 130 35 L 130 42 Q 130 52 120 52 L 100 52 L 95 57 L 95 52 Q 85 52 85 42 Z"
            fill="#0c1a3e" stroke="#3b82f6" stroke-width="1"/>
      <line x1="92" y1="33" x2="123" y2="33" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
      <line x1="92" y1="38" x2="118" y2="38" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
      <line x1="92" y1="43" x2="125" y2="43" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
      <line x1="92" y1="48" x2="110" y2="48" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
    </g>
    <!-- Top-right bubble -->
    <g opacity="0.45">
      <path d="M 210 30 Q 210 20 220 20 L 250 20 Q 260 20 260 30 L 260 38 Q 260 48 250 48 L 228 48 L 223 53 L 223 48 Q 210 48 210 38 Z"
            fill="#0c1a3e" stroke="#3b82f6" stroke-width="1"/>
      <line x1="217" y1="28" x2="253" y2="28" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
      <line x1="217" y1="34" x2="248" y2="34" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
      <line x1="217" y1="40" x2="255" y2="40" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
      <line x1="217" y1="45" x2="240" y2="45" stroke="#3b82f6" stroke-width="0.5" opacity="0.7"/>
    </g>
    <!-- Bottom-left small bubble -->
    <g opacity="0.4">
      <path d="M 75 155 Q 75 148 82 148 L 100 148 Q 107 148 107 155 L 107 162 Q 107 169 100 169 L 85 169 L 80 173 L 80 169 Q 75 169 75 162 Z"
            fill="#0c1a3e" stroke="#3b82f6" stroke-width="0.8"/>
      <line x1="80" y1="153" x2="102" y2="153" stroke="#3b82f6" stroke-width="0.4" opacity="0.7"/>
      <line x1="80" y1="158" x2="98" y2="158" stroke="#3b82f6" stroke-width="0.4" opacity="0.7"/>
      <line x1="80" y1="163" x2="100" y2="163" stroke="#3b82f6" stroke-width="0.4" opacity="0.7"/>
    </g>
    <!-- Bottom-right small bubble -->
    <g opacity="0.4">
      <path d="M 295 150 Q 295 143 302 143 L 320 143 Q 327 143 327 150 L 327 157 Q 327 164 320 164 L 305 164 L 300 168 L 300 164 Q 295 164 295 157 Z"
            fill="#0c1a3e" stroke="#3b82f6" stroke-width="0.8"/>
      <line x1="300" y1="148" x2="322" y2="148" stroke="#3b82f6" stroke-width="0.4" opacity="0.7"/>
      <line x1="300" y1="153" x2="318" y2="153" stroke="#3b82f6" stroke-width="0.4" opacity="0.7"/>
      <line x1="300" y1="158" x2="320" y2="158" stroke="#3b82f6" stroke-width="0.4" opacity="0.7"/>
    </g>
  </g>

  <!-- Stylized Z with upward arrow integrated -->
  <g filter="url(#strongGlow)">
    <!-- Z shape with arrow integrated -->
    <path d="M 120 50 L 200 50 L 200 55 L 135 110 L 195 110 L 195 105 L 200 105 L 200 120 L 120 120 L 120 115 L 185 60 L 120 60 Z"
          fill="url(#zGradient)" stroke="#60a5fa" stroke-width="0.5"/>
    <!-- Upward arrow integrated into Z (the top bar extends upward) -->
    <path d="M 155 30 L 165 45 L 160 45 L 160 50 L 150 50 L 150 45 L 145 45 Z"
          fill="#60a5fa" opacity="0.9"/>
    <!-- Arrow tip glow -->
    <path d="M 155 28 L 167 46 L 160 46 L 160 50 L 150 50 L 150 46 L 143 46 Z"
          fill="none" stroke="#93c5fd" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- "edAI" text to the right of Z -->
  <g filter="url(#blueGlow)">
    <text x="210" y="95" font-family="'Segoe UI', 'Tahoma', sans-serif" font-size="38" font-weight="700"
          fill="#7dd3fc" letter-spacing="1">
      edAI
    </text>
  </g>

  <!-- "AI YEMEN" text below -->
  <g filter="url(#softGlow)">
    <text x="200" y="175" font-family="'Segoe UI', 'Tahoma', sans-serif" font-size="16" font-weight="600"
          fill="#ffffff" text-anchor="middle" letter-spacing="4">
      AI YEMEN
    </text>
  </g>

  <!-- Subtle scan line effect -->
  <rect x="0" y="0" width="400" height="200" fill="none" stroke="#1e3a8a" stroke-width="0.3" opacity="0.3" rx="12"/>
</svg>
